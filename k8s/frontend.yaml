# VITE_API_BASE_URL is baked in at image build time:
#   docker build --build-arg VITE_API_BASE_URL=https://eapi.mitakiilab.com -t excboards-frontend excboards-frontend/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: excboards-frontend
  labels:
    app.kubernetes.io/name: excboards-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: excboards-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excboards-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: excboards-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: excboards-frontend
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps its pid + temp dirs under /tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: excboards-frontend
spec:
  selector:
    app.kubernetes.io/name: excboards-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
