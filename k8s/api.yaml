apiVersion: apps/v1
kind: Deployment
metadata:
  name: excboards-api
  labels:
    app.kubernetes.io/name: excboards-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: excboards-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excboards-api
    spec:
      # Lets open SignalR connections drain before the pod is killed
      terminationGracePeriodSeconds: 45
      # One replica per worker where possible, so losing a machine never takes out both
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: excboards-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: excboards-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: excboards-config
            - secretRef:
                name: excboards-secrets
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Give Traefik time to drop the endpoint before Kestrel stops accepting
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: excboards-api
  annotations:
    # SignalR negotiate + transport must hit the same pod (needed for the
    # long-polling/SSE fallbacks; the Redis backplane only fans out messages)
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: excboards_affinity
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
spec:
  selector:
    app.kubernetes.io/name: excboards-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: excboards-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: excboards-api
