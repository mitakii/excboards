# Copy to secret.yaml (gitignored), fill in, then `kubectl apply -f k8s/secret.yaml`.
# Or create it directly:
#   kubectl -n excboards create secret generic excboards-secrets --from-env-file=excboards.env
apiVersion: v1
kind: Secret
metadata:
  name: excboards-secrets
  namespace: excboards
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres.example.internal;Port=5432;Database=excboards;Username=excboards;Password=CHANGE_ME;SSL Mode=Require"
  JwtOptions__SigningKey: "CHANGE_ME_at_least_32_random_bytes"
  S3__ServiceURL: "https://<account-id>.r2.cloudflarestorage.com"
  S3__AccessKey: "CHANGE_ME"
  S3__SecretKey: "CHANGE_ME"
  CloudinarySettings__CloudName: "CHANGE_ME"
  CloudinarySettings__ApiKey: ""
  CloudinarySettings__ApiSecret: ""
