services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: excboards_dev
      POSTGRES_USER: excboards
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - excboards_pg_data:/var/lib/postgresql/data
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=admin123
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # Browser uploads/downloads hit storage directly via pre-signed URLs
      - RUSTFS_CORS_ALLOWED_ORIGINS=http://localhost:5173
    volumes:
      - rustfs-volume:/data
    ports:
      - "9000:9000"
      - "9001:9001"
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  excboards_pg_data:
  rustfs-volume:
    driver: local
  redis-data:
    driver: local
